<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Guía BDA – Base de Datos de Afiliados v24</title>
  <style>
    :root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#fbbf24;--purple:#a855f7;--teal:#14b8a6;--pink:#ec4899;--orange:#fb923c;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top left,#172554 0,#0f172a 32%,#020617 100%);color:var(--text);min-height:100vh;}
    header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,rgba(30,41,59,.98),rgba(15,23,42,.98));border-bottom:1px solid var(--line);backdrop-filter:blur(10px);}
    .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 14px;}
    .brand{display:flex;align-items:center;gap:12px;}
    .icon{background:var(--blue);border-radius:12px;padding:8px 11px;font-size:22px;box-shadow:0 10px 25px rgba(59,130,246,.25);}
    h1{margin:0;font-size:clamp(18px,3vw,28px);line-height:1.1;color:#f8fafc;}
    .sub{margin:4px 0 0;font-size:12px;color:var(--muted);}
    .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;}
    .tab{border:1px solid var(--line);background:#0f172a;color:var(--muted);padding:8px 13px;border-radius:999px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.15s;}
    .tab:hover{border-color:#60a5fa;color:#93c5fd;}
    .tab.active{background:var(--blue);color:white;border-color:var(--blue);}
    main{max-width:1180px;margin:0 auto;padding:22px 18px 52px;}
    .card{background:rgba(30,41,59,.88);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 16px 35px rgba(0,0,0,.20);}
    h2{margin:0 0 10px;font-size:17px;color:#93c5fd;}
    h3{margin:0 0 10px;font-size:15px;color:#f8fafc;}
    p{line-height:1.58;}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-top:14px;}
    .stat{background:#0f172a;border:1px solid var(--line);border-radius:12px;padding:12px;}
    .lbl{color:var(--dim);font-size:10px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;}
    .val{color:#f1f5f9;font-weight:700;font-size:13.5px;}
    .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
    .leg-item{display:flex;align-items:center;gap:6px;background:#0f172a;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);}
    .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0;}
    input,select{background:#1e293b;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 13px;outline:none;font-size:13px;}
    input{flex:1 1 240px;}
    .grid{display:grid;grid-template-columns:1fr;gap:10px;}
    .file-card{background:#1e293b;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.18s ease;}
    .file-card:hover{transform:translateY(-2px);border-color:#60a5fa;}
    .file-head{display:flex;gap:9px;align-items:flex-start;}
    .badge{border-radius:7px;padding:4px 8px;font-size:10.5px;font-weight:900;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;}
    .file-title{font-weight:800;font-size:13px;color:#f8fafc;}
    .file-meta{margin-top:4px;font-size:10.5px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
    .file-desc{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.48;display:none;}
    .file-key{margin-top:7px;font-size:11px;color:#fbbf24;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:none;}
    .file-key b{color:var(--dim);font-family:inherit;}
    .file-card.open .file-desc,.file-card.open .file-key{display:block;}
    .chip{display:inline-block;margin-top:7px;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:800;}
    .notice{border-radius:14px;padding:13px 16px;background:#0f172a;border:1px solid var(--line);color:var(--muted);margin-bottom:16px;font-size:13px;}
    .rule{font-size:12.5px;background:#0f172a;color:#fbbf24;border:1px solid #422006;border-radius:12px;padding:10px 13px;margin:9px 0 13px;}
    .key-box{background:linear-gradient(135deg,#1e3a5f,#0f172a);border:1px solid #1e40af;border-radius:12px;padding:10px 13px;margin:9px 0 13px;}
    .key-label{color:#93c5fd;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
    .key-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#dbeafe;font-size:12.5px;font-weight:700;}
    .tw{overflow:auto;border:1px solid var(--line);border-radius:12px;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:580px;}
    th{color:var(--dim);background:#0f172a;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-weight:700;}
    td{padding:9px 11px;border-bottom:1px solid rgba(51,65,85,.55);vertical-align:top;}
    tr:last-child td{border-bottom:none;}
    td.mono{color:#38bdf8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;}
    td.cod{color:#fbbf24;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;white-space:nowrap;}
    .relation{background:#1e293b;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:9px;}
    .relation.critical{border-color:#ef4444;}
    .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;}
    .phase{background:#0f172a;border-radius:13px;padding:13px;border:1px solid var(--line);}
    .ec{background:#1e293b;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px;}
    .er{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
    .codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;}
    .cb{background:#1e293b;border:1px solid var(--line);border-radius:11px;padding:11px;}
    .cb b{color:#fbbf24;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
    .concept-nav{position:sticky;top:116px;z-index:6;display:flex;flex-wrap:wrap;gap:7px;background:rgba(15,23,42,.94);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:18px;box-shadow:0 14px 32px rgba(0,0,0,.25);backdrop-filter:blur(10px);}
    .concept-nav-title{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#cbd5e1;font-size:12px;font-weight:800;margin-bottom:2px;}
    .concept-nav-hint{color:var(--dim);font-size:11px;font-weight:600;}
    .cnav-btn{border:1px solid var(--line);background:#0f172a;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;position:relative;overflow:hidden;}
    .cnav-btn:hover{border-color:#60a5fa;color:#93c5fd;}
    .cnav-btn.active{background:#1e293b !important;box-shadow:0 0 0 2px rgba(96,165,250,.22);transform:translateY(-1px);}
    .concept-card{background:#1e293b;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;scroll-margin-top:260px;transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;}
    .concept-card.concept-highlight{border-color:#fbbf24 !important;box-shadow:0 0 0 3px rgba(251,191,36,.18),0 18px 42px rgba(0,0,0,.30);transform:translateY(-2px);}
    .chead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
    .ctitle{font-size:15px;font-weight:800;color:#f8fafc;}
    .cdesc{font-size:13px;color:#cbd5e1;line-height:1.55;margin:0 0 11px;}
    .cdetails{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:7px;}
    .cd{background:#0f172a;border-radius:9px;padding:9px 11px;font-size:12.5px;}
    .cd b{color:#93c5fd;}
    .vtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px;}
    .vtab{border:1px solid var(--line);background:#0f172a;color:var(--muted);padding:6px 11px;border-radius:8px;font-weight:700;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;transition:.15s;}
    .vtab:hover{border-color:#60a5fa;color:#93c5fd;}
    .vtab.active{background:var(--blue);color:white;border-color:var(--blue);}
    .search-wrap{position:relative;flex:1 1 240px;min-width:240px;}
    .search-wrap input{width:100%;padding-right:42px;}
    .clear-search{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:none;border-radius:999px;background:#334155;color:#cbd5e1;display:none;align-items:center;justify-content:center;font-size:18px;font-weight:800;line-height:1;cursor:pointer;transition:.15s;}
    .clear-search:hover{background:#475569;color:#fff;transform:translateY(-50%) scale(1.04);}
    .clear-search.show{display:flex;}
    .floating-top-btn{position:fixed;right:18px;bottom:22px;z-index:30;width:46px;height:46px;border-radius:999px;border:1px solid #60a5fa55;background:rgba(15,23,42,.92);color:#93c5fd;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 14px 35px rgba(0,0,0,.32);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .18s ease,transform .18s ease,border-color .18s ease,color .18s ease;}
    .floating-top-btn.show{opacity:1;pointer-events:auto;transform:translateY(0);}
    .floating-top-btn:hover{border-color:#93c5fd;color:#dbeafe;transform:translateY(-2px);}
    @media(max-width:680px){
      header{position:static;}.er{grid-template-columns:1fr;}.tab,.cnav-btn,.vtab{width:100%;border-radius:10px;}.wrap,main{padding-left:12px;padding-right:12px;}.concept-nav{position:static;}.concept-card{scroll-margin-top:20px;}.search-wrap{width:100%;min-width:0;}.floating-top-btn{right:12px;bottom:14px;width:42px;height:42px;font-size:20px;}
    }
  </style>
</head>

let activeTab=0,search="",filterTipo="todos",expandedCard=null,expandedConcept=null,activeValArch="pers";
const app=document.getElementById("app"),tabsEl=document.getElementById("tabs");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function badge(t,c){return `<span class="badge" style="background:${c}22;color:${c}">${esc(t)}</span>`;}
function renderTabs(){tabsEl.innerHTML=TABS.map((t,i)=>`<button class="tab ${i===activeTab?"active":""}" onclick="setTab(${i})">${esc(t)}</button>`).join("");}
function setTab(i){activeTab=i;expandedCard=null;render();}
function render(){renderTabs();if(activeTab===0)return renderOverview();if(activeTab===1)return renderSaldos();if(activeTab===2)return renderDeudas();if(activeTab===3)return renderRelaciones();if(activeTab===4)return renderDiagnostico();if(activeTab===5)return renderConceptos();return renderValidaciones();}
function getFiltered(){const q=search.trim().toLowerCase();return archivos.filter(a=>{const ms=!q||[a.nom,a.pre,a.desc,a.key,a.tipo].some(x=>String(x).toLowerCase().includes(q));const mt=filterTipo==="todos"||a.tipo===filterTipo;return ms&&mt;});}
function renderArchivoGrid(filtered){if(!filtered.length)return `<div class="card" style="grid-column:1/-1;text-align:center;color:#94a3b8">Sin resultados. Borra la búsqueda con la X.</div>`;return filtered.map(a=>`<article class="file-card ${expandedCard===a.n?"open":""}" onclick="toggleCard(${a.n})" style="border-color:${expandedCard===a.n?tipoColor[a.tipo]:"#334155"}"><div class="file-head">${badge(a.pre,tipoColor[a.tipo])}<div style="flex:1"><div class="file-title">${a.n}. ${esc(a.nom)}</div><div class="file-meta">${esc(a.pre.toLowerCase())}aaaamm.ext</div><div class="file-desc">${esc(a.desc)}<br><span class="chip" style="background:${tipoColor[a.tipo]}33;color:${tipoColor[a.tipo]}">${esc(a.tipo)}</span></div><div class="file-key"><b>&#x1F511; Llave única:</b><br>${esc(a.key)}</div>${expandedCard===a.n&&conceptoArchivo[a.pre]?`
  <div onclick="event.stopPropagation();toggleConcept(${a.n})" style="margin-top:10px;padding:9px 12px;background:#0f172a;border-radius:10px;border:1px solid ${expandedConcept===a.n?"#60a5fa":"#334155"};cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px">
    <span style="display:flex;align-items:center;gap:7px"><span style="background:${conceptoArchivo[a.pre].color}22;color:${conceptoArchivo[a.pre].color};padding:2px 8px;border-radius:6px;font-size:10px;font-weight:900;text-transform:uppercase">Concepto clave</span><span style="font-size:12px;font-weight:700;color:#f8fafc">${conceptoArchivo[a.pre].emoji} ${esc(conceptoArchivo[a.pre].titulo)}</span></span>
    <span style="color:#64748b;font-size:14px;transition:.15s">${expandedConcept===a.n?"▲":"▼"}</span>
  </div>
  ${expandedConcept===a.n?renderConceptoInline(conceptoArchivo[a.pre]):""}
`:""}
</div></div></article>`).join("");}
function toggleConcept(n){expandedConcept=expandedConcept===n?null:n;updateUI();}
function updateUI(){const f=getFiltered();const g=document.getElementById("aGrid");const c=document.getElementById("aCnt");const x=document.getElementById("clearSearch");if(g)g.innerHTML=renderArchivoGrid(f);if(c)c.textContent=`${f.length} archivos`;if(x)x.classList.toggle("show",search.trim().length>0);}
function renderOverview(){const tipos=["todos",...Object.keys(tipoColor)];app.innerHTML=`<section class="card"><h2>¿Qué es la BDA?</h2><p style="margin:0;color:#cbd5e1">Informe mensual que cada AFP envía a la SP. Consolida TODA la información previsional: personas, cuentas, saldos, movimientos, bonos, pensionados, fallecidos, beneficiarios, deudas y rezagos.</p><div class="stats">${[["¿Quién envía?","Cada AFP"],["¿A quién?","Superintendencia de Pensiones"],["¿Cuándo?","Mensualmente (aaaamm)"],["¿Cómo?","Transmisión electrónica"],["Total archivos","44 archivos de datos"],["Versión actual","24 (vigente 2026)"]].map(d=>`<div class="stat"><div class="lbl">${d[0]}</div><div class="val">${d[1]}</div></div>`).join("")}</div></section><section class="card"><h3>&#x1F3A8; Significado de los colores</h3><p style="margin:0 0 10px;font-size:13px;color:var(--muted)">Cada archivo tiene un color según su categoría. Haz clic en cualquier tarjeta para ver descripción, llave única y concepto clave si aplica.</p><div class="legend">${Object.entries(tipoColor).map(([t,c])=>`<div class="leg-item"><div class="leg-dot" style="background:${c}"></div><span style="color:${c};font-weight:700">${t}</span><span style="color:var(--dim);font-size:11px"> — ${tipoLabel[t]}</span></div>`).join("")}</div></section><section class="filters"><div class="search-wrap"><input id="search" value="${esc(search)}" placeholder="Buscar archivo, prefijo, llave o descripción..." autocomplete="off"/><button id="clearSearch" class="clear-search ${search.trim()?"show":""}" type="button" onclick="clearSearch_()" title="Borrar búsqueda" aria-label="Borrar">&#x00D7;</button></div><select id="tipo">${tipos.map(t=>`<option value="${t}" ${t===filterTipo?"selected":""}>${t==="todos"?"Todos los tipos":t}</option>`).join("")}</select><span id="aCnt" style="font-size:12px;color:#64748b">${getFiltered().length} archivos</span></section><section class="grid" id="aGrid">${renderArchivoGrid(getFiltered())}</section>`;
  document.getElementById("search").addEventListener("input",e=>{search=e.target.value;expandedCard=null;updateUI();});
  document.getElementById("tipo").addEventListener("change",e=>{filterTipo=e.target.value;expandedCard=null;updateUI();});}
function clearSearch_(){search="";expandedCard=null;const i=document.getElementById("search");if(i){i.value="";i.focus();}updateUI();}
function toggleCard(n){expandedCard=expandedCard===n?null:n;updateUI();}
function renderSaldos(){app.innerHTML=`<section class="notice">&#x1F4A1; <b style="color:#10b981">Regla fundamental:</b> Saldo cuotas CTAS mes actual = Saldo cuotas CTAS mes anterior ± MCCI, por RUN + tipo cuenta + tipo fondo. El saldo en PESOS puede cambiar solo (valor cuota) — el saldo en CUOTAS no.</section>${saldos.map(g=>`<section class="card"><h3>${esc(g.titulo)}</h3><div class="key-box"><div class="key-label">Llave única</div><div class="key-value">${esc(g.key)}</div></div><div class="rule">&#x26A1; <b>Regla clave:</b> ${esc(g.regla)}</div><div class="tw"><table><thead><tr><th>Campo</th><th>Formato</th><th>Notas y validaciones</th></tr></thead><tbody>${g.campos.map(c=>`<tr><td><b>${esc(c.c)}</b></td><td class="mono">${esc(c.f)}</td><td style="color:#94a3b8">${esc(c.n)}</td></tr>`).join("")}</tbody></table></div></section>`).join("")}`;}
function renderDeudas(){app.innerHTML=`<section class="notice">&#x1F4A1; <b style="color:#ef4444">Flujo de deudas:</b> DPRE (presunta) → DCPC+DCRI → EMCT/CPET (tribunales). Si paga tarde → CREZ. <b>V24:</b> CPET ahora incluye RUN empleador y código tribunal.</section>${deudas.map(g=>`<section class="card"><h3>${esc(g.titulo)}</h3>${g.desc?`<p style="margin:0 0 8px;color:#64748b;font-size:13px">${esc(g.desc)}</p>`:""}<div class="key-box"><div class="key-label">Llave única</div><div class="key-value">${esc(g.key)}</div></div><div class="rule">&#x26A1; <b>Regla clave:</b> ${esc(g.regla)}</div><div class="tw"><table><thead><tr><th>Campo</th><th>Formato</th><th>Notas</th></tr></thead><tbody>${g.campos.map(c=>`<tr><td><b>${esc(c.c)}</b></td><td class="mono">${esc(c.f)}</td><td style="color:#94a3b8">${esc(c.n)}</td></tr>`).join("")}</tbody></table></div></section>`).join("")}`;}
function renderRelaciones(){const fases=[{fase:"1. Afiliación",archivos:["PERS"],color:"#6366f1",desc:"Punto de entrada. Valida existencia y estado."},{fase:"2. Cotizaciones activas",archivos:["CTAS","MCCI","SCAI","SCCV","SPVC"],color:"#10b981",desc:"Saldos y movimientos por cuenta/fondo."},{fase:"3. Deudas y rezagos",archivos:["DPRE","DCPC","DCRI","CREZ"],color:"#ef4444",desc:"Empleadores que no pagaron o cotizaciones atrasadas."},{fase:"4. Pensión",archivos:["AFPI","AFPV","PPVI","RVVI","ANVI"],color:"#ec4899",desc:"Dictámenes, modalidad, pagos y anualidades."},{fase:"5. Fallecimiento",archivos:["AFAL","AFPS","BEPS","PBPS","RVPS"],color:"#6b7280",desc:"Causante, beneficiarios y pagos sobrevivencia."},{fase:"6. Bonos y extras",archivos:["BONO","DABR","CDTF","SETR"],color:"#f59e0b",desc:"Bonos, cambios de fondo y solicitudes."}];
app.innerHTML=`<section class="notice">&#x1F4A1; Cuando algo falla, <b style="color:#a5b4fc">PERS es siempre el primer archivo a revisar</b>.</section>${relaciones.map(r=>`<section class="relation ${r.critico?"critical":""}"><div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap">${badge(r.desde,"#60a5fa")} <span style="color:#64748b;font-size:18px">→</span> ${badge(r.hacia,"#a5b4fc")} ${r.critico?`<span class="badge" style="background:#ef444422;color:#f87171">CRÍTICO</span>`:""}</div><div style="margin-top:8px;color:#94a3b8;font-size:13px;line-height:1.5">${esc(r.regla)}</div></section>`).join("")}<section class="card" style="margin-top:20px"><h3>Ciclo de vida de un afiliado</h3><div class="flow">${fases.map(f=>`<div class="phase" style="border-color:${f.color}44"><div style="color:${f.color};font-weight:800;margin-bottom:6px">${esc(f.fase)}</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px">${f.archivos.map(a=>badge(a,f.color)).join("")}</div><div style="font-size:11.5px;color:#94a3b8">${esc(f.desc)}</div></div>`).join("")}</div></section>`;}
function renderDiagnostico(){app.innerHTML=`<section class="notice">&#x1F4A1; <b style="color:#fbbf24">Proceso de validación SP:</b> 1) Estructura inicial → 2) Coherencia y repetidos → 3) Validación de datos. Etapas 1 y 2 rechazan el <b>informe completo</b>.</section><h3>&#x274C; Errores más comunes y cómo prevenirlos</h3>${erroresTipicos.map(e=>`<article class="ec"><div class="er"><div><div style="font-weight:800;color:#f87171;margin-bottom:4px">${esc(e.error)}</div><div style="font-size:12px;color:#94a3b8">Ejemplo: ${esc(e.ej)}</div></div><div><div style="font-size:12px;color:#4ade80;margin-bottom:6px">&#x2705; ${esc(e.prev)}</div>${badge("Código: "+e.cod,"#fbbf24")} ${badge(e.arch,"#60a5fa")}</div></div></article>`).join("")}<h3 style="margin-top:22px">Códigos de error completos</h3><div class="codes">${codigosError.map(c=>`<div class="cb"><b>${esc(c.cod)}</b><div style="font-size:12px;color:#94a3b8;margin-top:4px">${esc(c.desc)}</div></div>`).join("")}</div><section class="card" style="margin-top:20px"><h3>&#x1F50E; Guía de diagnóstico rápido</h3><p style="font-size:12.5px;color:#94a3b8;margin:0 0 13px">Encuentra la causa raíz usando esta tabla.</p>${diagnosticoRapido.map(d=>`<div class="phase" style="margin-bottom:8px"><div style="font-size:13px;color:#f87171;font-weight:800;margin-bottom:4px">&#x1F534; ${esc(d[0])}</div><div style="font-size:12px"><span style="color:#64748b">Tabla(s): </span><b style="color:#60a5fa;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">${esc(d[1])}</b></div><div style="font-size:12px;color:#94a3b8;margin-top:3px">→ ${esc(d[2])}</div></div>`).join("")}</section>`;}
function renderConceptos(){app.innerHTML=`<section class="notice">&#x1F393; Conceptos clave para entender el negocio. Usa el índice sticky — pincha y baja directo con resaltado.</section><div class="concept-nav" id="concept-nav"><div class="concept-nav-title"><span>&#x1F4CC; Índice de conceptos</span><span class="concept-nav-hint">Pincha para ir directo</span></div>${conceptos.map(c=>`<button class="cnav-btn" data-target="c-${c.id}" onclick="goConcepto('c-${c.id}')" style="border-color:${c.color}55;color:${c.color}">${c.emoji} ${esc(c.titulo.split("–")[0].trim())}</button>`).join("")}</div>${conceptos.map(c=>`<section class="concept-card" id="c-${c.id}" style="border-left:4px solid ${c.color}"><div class="chead"><span style="background:${c.color}22;color:${c.color};padding:4px 10px;border-radius:7px;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase">Concepto clave</span><div class="ctitle">${c.emoji} ${esc(c.titulo)}</div></div><p class="cdesc">${esc(c.desc)}</p><div class="cdetails">${c.detalles.map(d=>`<div class="cd"><b>${esc(d[0])}:</b> <span style="color:#cbd5e1">${esc(d[1])}</span></div>`).join("")}</div></section>`).join("")}`;
  const t=location.hash&&location.hash.replace("#","");if(t&&t.startsWith("c-"))setTimeout(function(){goConcepto(t);},120);}
function goConcepto(id){var el=document.getElementById(id);if(!el)return;document.querySelectorAll(".cnav-btn").forEach(function(b){b.classList.remove("active");});var btn=document.querySelector('[data-target="'+id+'"]');if(btn)btn.classList.add("active");var hdr=document.querySelector("header");var nav=document.getElementById("concept-nav");var hh=hdr&&window.getComputedStyle(hdr).position==="sticky"?hdr.offsetHeight:0;var nh=nav&&window.innerWidth>680?nav.offsetHeight:0;var y=el.getBoundingClientRect().top+window.scrollY-hh-nh-24;window.scrollTo({top:Math.max(y,0),behavior:"smooth"});el.classList.add("concept-highlight");setTimeout(function(){el.classList.remove("concept-highlight");},1400);}
function renderValidaciones(){
  var archsKeys=Object.keys(valPorArchivo);
  var newFiles=["dcpc","dpre","csis","dcri"];
  app.innerHTML=`<section class="notice">&#x2705; Validaciones extraídas de <b>validacionesBDAAFP.xlsx</b> (v24). <b style="color:#fbbf24">I</b>=intra · <b style="color:#60a5fa">E</b>=entre archivos · <b style="color:#a855f7">EA</b>=entre AFPs · <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;vertical-align:middle;margin:0 1px"></span>=nuevo en v24 · <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#fb923c;vertical-align:middle;margin:0 1px"></span>=modificado en v24.</section><section class="card"><h3>Las 3 etapas de validación de la SP</h3><div class="tw"><table><thead><tr><th>Etapa</th><th>Qué valida</th><th>Archivo de error generado</th><th>Consecuencia</th></tr></thead><tbody>${valProceso.map(e=>`<tr><td><b>${esc(e.etapa)}</b></td><td style="color:#94a3b8;font-size:12px">${esc(e.valida)}</td><td class="mono" style="font-size:11px">${esc(e.archivo)}</td><td style="color:${e.critico?"#f87171":"#4ade80"};font-size:12px;font-weight:700">${esc(e.consecuencia)}</td></tr>`).join("")}</tbody></table></div></section><section class="card"><h3>&#x1F50D; Validaciones por archivo</h3><p style="font-size:12.5px;color:#94a3b8;margin:0 0 11px">Selecciona un archivo. Las pestañas y códigos con <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;vertical-align:middle;margin:0 2px"></span> son nuevos en v24.</p><div class="vtabs">${archsKeys.map(a=>{var isNew=newFiles.includes(a);return`<button class="vtab ${activeValArch===a?"active":""}" onclick="setValArch('${a}')" style="${isNew?"border-color:#4ade6044":""}">${a.toUpperCase()}${isNew?` <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;vertical-align:middle;margin-left:4px"></span>`:""}</button>`;}).join("")}</div><div class="tw"><table><thead><tr><th style="width:85px">Código</th><th style="width:165px">Campo</th><th>Descripción</th><th style="width:55px">Tipo</th></tr></thead><tbody>${valPorArchivo[activeValArch].map(v=>{var tc={I:"#fbbf24",E:"#60a5fa",EA:"#a855f7"};var isNew=v[4]==="new";var isMod=v[4]==="mod";return`<tr style="${isNew?"background:rgba(74,222,96,.05)":isMod?"background:rgba(251,146,60,.04)":""}"><td class="cod">${esc(v[0])}${isNew?' <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;vertical-align:middle;margin-left:3px"></span>':""}${isMod?' <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#fb923c;vertical-align:middle;margin-left:3px"></span>':""}</td><td><b>${esc(v[1])}</b></td><td style="color:#cbd5e1">${esc(v[2])}</td><td><span class="badge" style="background:${tc[v[3]]}22;color:${tc[v[3]]}">${esc(v[3])}</span></td></tr>`;}).join("")}</tbody></table></div></section>`;}
function setValArch(a){activeValArch=a;renderValidaciones();}
function goPageTop(){window.scrollTo({top:0,behavior:"smooth"});}
function updateBackTop(){var b=document.getElementById("backTopBtn");if(b)b.classList.toggle("show",window.scrollY>280);}
window.addEventListener("scroll",updateBackTop,{passive:true});
window.addEventListener("load",updateBackTop);
render();
</script>
</body>
