<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guía BDA – Base de Datos de Afiliados</title>
  <style>
    :root {
      --bg:#0f172a; --panel:#1e293b; --panel2:#111827; --line:#334155;
      --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b; --blue:#3b82f6;
      --green:#10b981; --red:#ef4444; --yellow:#fbbf24;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top left, #172554 0, #0f172a 32%, #020617 100%);
      color:var(--text); min-height:100vh;
    }
    header {
      position: sticky; top:0; z-index:10;
      background: linear-gradient(135deg, rgba(30,41,59,.98), rgba(15,23,42,.98));
      border-bottom:1px solid var(--line); backdrop-filter: blur(10px);
    }
    .wrap { max-width:1180px; margin:0 auto; padding:22px 18px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .icon { background:var(--blue); border-radius:12px; padding:8px 11px; font-size:22px; box-shadow:0 10px 25px rgba(59,130,246,.25); }
    h1 { margin:0; font-size:clamp(21px, 3vw, 31px); line-height:1.1; color:#f8fafc; }
    .sub { margin:5px 0 0; font-size:13px; color:var(--muted); }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
    .tab {
      border:1px solid var(--line); background:#0f172a; color:var(--muted); padding:9px 14px;
      border-radius:999px; font-weight:700; font-size:13px; cursor:pointer;
    }
    .tab.active { background:var(--blue); color:white; border-color:var(--blue); }
    main { max-width:1180px; margin:0 auto; padding:24px 18px 52px; }
    .card { background:rgba(30,41,59,.88); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:18px; box-shadow:0 16px 35px rgba(0,0,0,.20); }
    h2 { margin:0 0 10px; font-size:18px; color:#93c5fd; }
    h3 { margin:0 0 10px; font-size:16px; color:#f8fafc; }
    p { line-height:1.58; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px; margin-top:16px; }
    .stat { background:#0f172a; border:1px solid var(--line); border-radius:12px; padding:13px; }
    .label { color:var(--dim); font-size:11px; margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
    .value { color:#f1f5f9; font-weight:700; font-size:14px; }
    .filters { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:18px 0; }
    input, select {
      background:#1e293b; border:1px solid var(--line); color:var(--text); border-radius:12px;
      padding:10px 13px; outline:none; font-size:13px;
    }
    input { flex:1 1 260px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:13px; }
    .file-card { background:#1e293b; border:1px solid var(--line); border-radius:15px; padding:15px; cursor:pointer; transition:.18s ease; }
    .file-card:hover { transform:translateY(-2px); border-color:#60a5fa; }
    .file-head { display:flex; gap:10px; align-items:flex-start; }
    .badge { border-radius:8px; padding:4px 9px; font-size:11px; font-weight:900; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; white-space:nowrap; }
    .file-title { font-weight:800; font-size:13.5px; color:#f8fafc; }
    .file-desc { margin-top:9px; font-size:12.5px; color:var(--muted); line-height:1.48; display:none; }
    .file-card.open .file-desc { display:block; }
    .chip { display:inline-block; margin-top:8px; border-radius:999px; padding:3px 9px; font-size:11px; font-weight:800; }
    .notice { border-radius:14px; padding:14px 16px; background:#0f172a; border:1px solid var(--line); color:var(--muted); margin-bottom:18px; }
    .rule { font-size:12.5px; background:#0f172a; color:#fbbf24; border:1px solid #422006; border-radius:12px; padding:11px 13px; margin:10px 0 14px; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:12px; }
    table { width:100%; border-collapse:collapse; font-size:12.5px; min-width:650px; }
    th { color:var(--dim); background:#0f172a; text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
    td { padding:10px 12px; border-bottom:1px solid rgba(51,65,85,.65); vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    td:nth-child(2) { color:#38bdf8; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; white-space:nowrap; }
    .relation { background:#1e293b; border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:10px; }
    .relation.critical { border-color:#ef4444; }
    .arrow { color:#64748b; font-size:18px; }
    .flow { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
    .phase { background:#0f172a; border-radius:14px; padding:14px; border:1px solid var(--line); }
    .error-card { background:#1e293b; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:9px; }
    .error-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .codes { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:9px; }
    .code { background:#1e293b; border:1px solid var(--line); border-radius:12px; padding:12px; }
    .code b { color:#fbbf24; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
    .hidden { display:none; }
    @media (max-width:700px) {
      header { position:static; }
      .error-row { grid-template-columns:1fr; }
      .tab { width:100%; text-align:left; border-radius:12px; }
      .wrap, main { padding-left:14px; padding-right:14px; }
    }
  </style>
</head>

const tipoColor = {
  maestro: "#6366f1",
  bono: "#f59e0b",
  saldo: "#10b981",
  movimiento: "#3b82f6",
  plan: "#8b5cf6",
  pension: "#ec4899",
  fallecido: "#6b7280",
  beneficiario: "#14b8a6",
  deuda: "#ef4444",
  seguro: "#0ea5e9",
  internacional: "#a855f7",
  identificador: "#84cc16",
  contacto: "#fb923c",
};

let activeTab = 0;
let search = "";
let filterTipo = "todos";
let expandedCard = null;

const app = document.getElementById("app");
const tabsEl = document.getElementById("tabs");

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
}

function badge(text, color) {
  return `<span class="badge" style="background:${color}22;color:${color}">${esc(text)}</span>`;
}

function renderTabs() {
  tabsEl.innerHTML = TABS.map((t,i) => `<button class="tab ${i===activeTab ? "active" : ""}" onclick="setTab(${i})">${esc(t)}</button>`).join("");
}

function setTab(i) {
  activeTab = i; expandedCard = null; render();
}

function render() {
  renderTabs();
  if (activeTab === 0) return renderOverview();
  if (activeTab === 1) return renderGrupos("saldos");
  if (activeTab === 2) return renderGrupos("deudas");
  if (activeTab === 3) return renderRelaciones();
  return renderDiagnostico();
}

function renderOverview() {
  const tipos = ["todos", ...Object.keys(tipoColor)];
  const filtered = data.overview.archivos.filter(a => {
    const q = search.trim().toLowerCase();
    const matchSearch = !q || [a.nom, a.pre, a.desc].some(x => x.toLowerCase().includes(q));
    const matchTipo = filterTipo === "todos" || a.tipo === filterTipo;
    return matchSearch && matchTipo;
  });
  app.innerHTML = `
    <section class="card">
      <h2>¿Qué es la BDA?</h2>
      <p style="margin:0;color:#cbd5e1">${esc(data.overview.desc)}</p>
      <div class="stats">
        ${[
          ["¿Quién envía?", "Cada AFP"],
          ["¿A quién?", "Superintendencia de Pensiones"],
          ["¿Cuándo?", "Mensualmente (aaaamm)"],
          ["¿Cómo?", "Transmisión electrónica"],
          ["Total archivos", "44 archivos de datos"],
        ].map(d => `<div class="stat"><div class="label">${d[0]}</div><div class="value">${d[1]}</div></div>`).join("")}
      </div>
    </section>
    <section class="filters">
      <input id="search" value="${esc(search)}" placeholder="🔍 Buscar archivo, prefijo o descripción..." />
      <select id="tipo">
        ${tipos.map(t => `<option value="${t}" ${t===filterTipo ? "selected" : ""}>${t==="todos" ? "Todos los tipos" : t}</option>`).join("")}
      </select>
      <span style="font-size:12px;color:#64748b">${filtered.length} archivos</span>
    </section>
    <section class="grid">
      ${filtered.map(a => `
        <article class="file-card ${expandedCard===a.n ? "open" : ""}" onclick="toggleCard(${a.n})" style="border-color:${expandedCard===a.n ? tipoColor[a.tipo] : "#334155"}">
          <div class="file-head">
            ${badge(a.pre, tipoColor[a.tipo])}
            <div>
              <div class="file-title">${a.n}. ${esc(a.nom)}</div>
              <div class="file-desc">
                ${esc(a.desc)}
                <br><span class="chip" style="background:${tipoColor[a.tipo]}33;color:${tipoColor[a.tipo]}">${esc(a.tipo)}</span>
              </div>
            </div>
          </div>
        </article>
      `).join("")}
    </section>
  `;
  document.getElementById("search").addEventListener("input", e => { search = e.target.value; renderOverview(); });
  document.getElementById("tipo").addEventListener("change", e => { filterTipo = e.target.value; renderOverview(); });
}

function toggleCard(n) { expandedCard = expandedCard === n ? null : n; renderOverview(); }

function renderGrupos(kind) {
  const isDebt = kind === "deudas";
  const intro = isDebt
    ? `💡 <b style="color:#ef4444">Flujo de deudas:</b> Una deuda nace como DPRE (presunta) → si el empleador la reconoce o no aclara → pasa a DCPC (carátula) con detalle en DCRI → si queda impaga → puede ir a cobranza judicial (EMCT/CPET). Si se paga con rezago → aparece en CREZ.`
    : `💡 <b style="color:#10b981">Regla fundamental de saldos:</b> El saldo en CTAS al cierre del mes = Saldo CTAS mes anterior ± todos los movimientos en MCCI del mes, por RUN + tipo de cuenta + tipo de fondo. Si no cuadra, el error está en MCCI o en el saldo inicial de CTAS.`;
  app.innerHTML = `
    <section class="notice">${intro}</section>
    ${data[kind].grupos.map(g => `
      <section class="card">
        <h3>${esc(g.titulo)}</h3>
        ${g.desc ? `<p style="margin:0 0 10px;color:#64748b;font-size:13px">${esc(g.desc)}</p>` : ""}
        <div class="rule">⚡ <b>Regla clave:</b> ${esc(g.regla)}</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Campo</th><th>Formato</th><th>Notas</th></tr></thead>
            <tbody>
              ${g.campos.map(c => `<tr><td><b>${esc(c.campo)}</b></td><td>${esc(c.formato)}</td><td style="color:#94a3b8">${esc(c.nota)}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
      </section>
    `).join("")}
  `;
}

function renderRelaciones() {
  const fases = [

    { fase:"2. Cotizaciones activas", archivos:["CTAS","MCCI","SCAI","SCCV","SPVC"], color:"#10b981", desc:"Saldos y movimientos por cuenta/fondo." },
    { fase:"3. Deudas y rezagos", archivos:["DPRE","DCPC","DCRI","CREZ"], color:"#ef4444", desc:"Empleadores que no pagaron o cotizaciones atrasadas." },
    { fase:"4. Pensión", archivos:["AFPI","AFPV","PPVI","RVVI","ANVI"], color:"#ec4899", desc:"Dictámenes, modalidad, pagos y anualidades." },
    { fase:"5. Fallecimiento", archivos:["AFAL","AFPS","BEPS","PBPS","RVPS"], color:"#6b7280", desc:"Causante, beneficiarios y pagos de sobrevivencia." },
    { fase:"6. Bonos y extras", archivos:["BONO","DABR","CDTF","SETR"], color:"#f59e0b", desc:"Bonos, cambios de fondo y solicitudes." },
  ];
  app.innerHTML = `
    <section class="notice">💡 Cuando algo se reporta mal, <b style="color:#a5b4fc">PERS es siempre el primer lugar a revisar</b>. Casi todos los errores de consistencia entre archivos se detectan cruzando contra PERS.</section>
    ${data.relaciones.principales.map(r => `
      <section class="relation ${r.critico ? "critical" : ""}">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          ${badge(r.desde, "#60a5fa")} <span class="arrow">→</span> ${badge(r.hacia, "#a5b4fc")}
          ${r.critico ? `<span class="badge" style="background:#ef444422;color:#f87171">CRÍTICO</span>` : ""}
        </div>
        <div style="margin-top:9px;color:#94a3b8;font-size:13px;line-height:1.5">${esc(r.regla)}</div>
      </section>
    `).join("")}
    <section class="card" style="margin-top:22px">
      <h3>🗺️ Flujo de datos del ciclo de vida de un afiliado</h3>
      <div class="flow">
        ${fases.map(f => `<div class="phase" style="border-color:${f.color}44">
          <div style="color:${f.color};font-weight:800;margin-bottom:7px">${esc(f.fase)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">${f.archivos.map(a => badge(a, f.color)).join("")}</div>
          <div style="font-size:12px;color:#94a3b8">${esc(f.desc)}</div>
        </div>`).join("")}
      </div>
    </section>
  `;
}

    ["Pago a pensionado sin respaldo", "PPVI ↔ AFPI/AFPV", "El RUN en PPVI debe existir en AFPI o AFPV con modalidad compatible."],

    ["Cotización declarada pero no abonada", "CREZ o DPRE", "Si está en rezago: CREZ. Si no declaró ni pagó: DPRE."],
  ];
  app.innerHTML = `
    <section class="notice">💡 <b style="color:#fbbf24">Proceso de validación SP:</b> 1) Estructura inicial (EE) → 2) Coherencia y datos repetidos → 3) Validación de datos intra e interarchivo.</section>
    <h3>❌ Errores más comunes y cómo prevenirlos</h3>
    ${data.errores.tipicos.map(e => `
      <article class="error-card">
        <div class="error-row">
          <div>
            <div style="font-weight:800;color:#f87171;margin-bottom:4px">${esc(e.error)}</div>

    <h3 style="margin-top:24px">📟 Códigos de error EE</h3>
    <section class="codes">
      ${data.errores.codigos.map(c => `<div class="code"><b>${esc(c.cod)}</b><div style="font-size:12px;color:#94a3b8;margin-top:5px">${esc(c.desc)}</div></div>`).join("")}

      ${rapido.map(d => `<div class="phase" style="margin-bottom:9px">

        <div style="font-size:12px"><span style="color:#64748b">Tabla(s): </span><b style="color:#60a5fa;font-family:ui-monospace, SFMono-Regular, Menlo, monospace">${esc(d[1])}</b></div>
        <div style="font-size:12px;color:#94a3b8;margin-top:4px">→ ${esc(d[2])}</div>
      </div>`).join("")}

  `;
}
