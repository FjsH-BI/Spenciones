<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Guía BDA – Base de Datos de Afiliados v23</title>
  <style>
    :root{
      --bg:#0f172a;--panel:#1e293b;--line:#334155;
      --text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;
      --blue:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#fbbf24;
      --purple:#a855f7;--teal:#14b8a6;--pink:#ec4899;--orange:#fb923c;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
      background:radial-gradient(circle at top left,#172554 0,#0f172a 32%,#020617 100%);
      color:var(--text);min-height:100vh;}
    header{position:sticky;top:0;z-index:10;
      background:linear-gradient(135deg,rgba(30,41,59,.98),rgba(15,23,42,.98));
      border-bottom:1px solid var(--line);backdrop-filter:blur(10px);}
    .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 14px;}
    .brand{display:flex;align-items:center;gap:12px;}
    .icon{background:var(--blue);border-radius:12px;padding:8px 11px;font-size:22px;
      box-shadow:0 10px 25px rgba(59,130,246,.25);}
    h1{margin:0;font-size:clamp(18px,3vw,28px);line-height:1.1;color:#f8fafc;}
    .sub{margin:4px 0 0;font-size:12px;color:var(--muted);}
    .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;}
    .tab{border:1px solid var(--line);background:#0f172a;color:var(--muted);
      padding:8px 13px;border-radius:999px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.15s;}
    .tab:hover{border-color:#60a5fa;color:#93c5fd;}
    .tab.active{background:var(--blue);color:white;border-color:var(--blue);}
    main{max-width:1180px;margin:0 auto;padding:22px 18px 52px;}
    .card{background:rgba(30,41,59,.88);border:1px solid var(--line);border-radius:18px;
      padding:20px;margin-bottom:18px;box-shadow:0 16px 35px rgba(0,0,0,.20);}
    h2{margin:0 0 10px;font-size:17px;color:#93c5fd;}
    h3{margin:0 0 10px;font-size:15px;color:#f8fafc;}
    p{line-height:1.58;}
    /* ── stats grid ── */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-top:14px;}
    .stat{background:#0f172a;border:1px solid var(--line);border-radius:12px;padding:12px;}
    .lbl{color:var(--dim);font-size:10px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;}
    .val{color:#f1f5f9;font-weight:700;font-size:13.5px;}
    /* ── legend ── */
    .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
    .leg-item{display:flex;align-items:center;gap:6px;background:#0f172a;border:1px solid var(--line);
      border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);}
    .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    /* ── filters ── */
    .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0;}
    input,select{background:#1e293b;border:1px solid var(--line);color:var(--text);
      border-radius:12px;padding:9px 13px;outline:none;font-size:13px;}
    input{flex:1 1 240px;}
    /* ── file cards ── */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
    .file-card{background:#1e293b;border:1px solid var(--line);border-radius:14px;
      padding:14px;cursor:pointer;transition:.18s ease;}
    .file-card:hover{transform:translateY(-2px);border-color:#60a5fa;}
    .file-head{display:flex;gap:9px;align-items:flex-start;}
    .badge{border-radius:7px;padding:4px 8px;font-size:10.5px;font-weight:900;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;}
    .file-title{font-weight:800;font-size:13px;color:#f8fafc;}
    .file-meta{margin-top:4px;font-size:10.5px;color:var(--dim);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
    .file-desc{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.48;display:none;}
    .file-key{margin-top:7px;font-size:11px;color:#fbbf24;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:none;}
    .file-key b{color:var(--dim);font-family:inherit;}
    .file-card.open .file-desc,.file-card.open .file-key{display:block;}
    .chip{display:inline-block;margin-top:7px;border-radius:999px;
      padding:2px 8px;font-size:10.5px;font-weight:800;}
    /* ── notice / rule / key-box ── */
    .notice{border-radius:14px;padding:13px 16px;background:#0f172a;
      border:1px solid var(--line);color:var(--muted);margin-bottom:16px;font-size:13px;}
    .rule{font-size:12.5px;background:#0f172a;color:#fbbf24;
      border:1px solid #422006;border-radius:12px;padding:10px 13px;margin:9px 0 13px;}
    .key-box{background:linear-gradient(135deg,#1e3a5f,#0f172a);
      border:1px solid #1e40af;border-radius:12px;padding:10px 13px;margin:9px 0 13px;}
    .key-label{color:#93c5fd;font-size:10px;font-weight:800;text-transform:uppercase;
      letter-spacing:.05em;margin-bottom:4px;}
    .key-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      color:#dbeafe;font-size:12.5px;font-weight:700;}
    /* ── tables ── */
    .tw{overflow:auto;border:1px solid var(--line);border-radius:12px;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:580px;}
    th{color:var(--dim);background:#0f172a;text-align:left;
      padding:9px 11px;border-bottom:1px solid var(--line);font-weight:700;}
    td{padding:9px 11px;border-bottom:1px solid rgba(51,65,85,.55);vertical-align:top;}
    tr:last-child td{border-bottom:none;}
    td.mono{color:#38bdf8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;}
    td.cod{color:#fbbf24;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-weight:700;white-space:nowrap;}
    /* ── relations ── */
    .relation{background:#1e293b;border:1px solid var(--line);border-radius:13px;
      padding:14px;margin-bottom:9px;}
    .relation.critical{border-color:#ef4444;}
    /* ── flow ── */
    .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;}
    .phase{background:#0f172a;border-radius:13px;padding:13px;border:1px solid var(--line);}
    /* ── error cards ── */
    .ec{background:#1e293b;border:1px solid var(--line);border-radius:13px;
      padding:13px;margin-bottom:8px;}
    .er{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
    .codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;}
    .cb{background:#1e293b;border:1px solid var(--line);border-radius:11px;padding:11px;}
    .cb b{color:#fbbf24;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
    /* ── concepts ── */
    .concept-nav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
    .cnav-btn{border:1px solid var(--line);background:#0f172a;color:var(--muted);
      padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
    .cnav-btn:hover{border-color:#60a5fa;color:#93c5fd;}
    .concept-card{background:#1e293b;border:1px solid var(--line);
      border-radius:16px;padding:18px;margin-bottom:14px;scroll-margin-top:120px;}
    .chead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
    .ctitle{font-size:15px;font-weight:800;color:#f8fafc;}
    .cdesc{font-size:13px;color:#cbd5e1;line-height:1.55;margin:0 0 11px;}
    .cdetails{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:7px;}
    .cd{background:#0f172a;border-radius:9px;padding:9px 11px;font-size:12.5px;}
    .cd b{color:#93c5fd;}
    /* ── val tabs ── */
    .vtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px;}
    .vtab{border:1px solid var(--line);background:#0f172a;color:var(--muted);
      padding:6px 11px;border-radius:8px;font-weight:700;font-size:11.5px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;transition:.15s;}
    .vtab:hover{border-color:#60a5fa;color:#93c5fd;}
    .vtab.active{background:var(--blue);color:white;border-color:var(--blue);}
    .sn{font-size:11.5px;color:var(--dim);margin-top:5px;font-style:italic;}
    @media(max-width:680px){
      header{position:static;}
      .er{grid-template-columns:1fr;}
      .tab,.cnav-btn,.vtab{width:100%;border-radius:10px;}
      .wrap,main{padding-left:12px;padding-right:12px;}
    }


    /* ── búsqueda mejorada + botón volver arriba ── */
    .search-wrap{position:relative;flex:1 1 240px;min-width:240px;}
    .search-wrap input{width:100%;padding-right:42px;}
    .clear-search{position:absolute;right:8px;top:50%;transform:translateY(-50%);
      width:26px;height:26px;border:none;border-radius:999px;background:#334155;color:#cbd5e1;
      display:none;align-items:center;justify-content:center;font-size:18px;font-weight:800;
      line-height:1;cursor:pointer;transition:.15s;}
    .clear-search:hover{background:#475569;color:#ffffff;transform:translateY(-50%) scale(1.04);}
    .clear-search.show{display:flex;}
    .floating-top-btn{position:fixed;right:18px;bottom:22px;z-index:30;width:46px;height:46px;
      border-radius:999px;border:1px solid #60a5fa55;background:rgba(15,23,42,.92);color:#93c5fd;
      font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 14px 35px rgba(0,0,0,.32);
      backdrop-filter:blur(10px);opacity:0;pointer-events:none;transform:translateY(10px);
      transition:opacity .18s ease,transform .18s ease,border-color .18s ease,color .18s ease;}
    .floating-top-btn.show{opacity:1;pointer-events:auto;transform:translateY(0);}
    .floating-top-btn:hover{border-color:#93c5fd;color:#dbeafe;transform:translateY(-2px);}
    @media(max-width:680px){
      .search-wrap{width:100%;min-width:0;}
      .floating-top-btn{right:12px;bottom:14px;width:42px;height:42px;font-size:20px;}
    }
  </style>
</head>

const saldos=[

let activeTab=0, search="", filterTipo="todos", expandedCard=null, activeValArch="pers";

const app=document.getElementById("app");
const tabsEl=document.getElementById("tabs");

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function badge(t,c){return `<span class="badge" style="background:${c}22;color:${c}">${esc(t)}</span>`;}

function renderTabs(){
  tabsEl.innerHTML=TABS.map((t,i)=>`<button class="tab ${i===activeTab?"active":""}" onclick="setTab(${i})">${esc(t)}</button>`).join("");
}
function setTab(i){activeTab=i;expandedCard=null;render();}

function render(){
  renderTabs();
  if(activeTab===0)return renderOverview();
  if(activeTab===1)return renderSaldos();
  if(activeTab===2)return renderDeudas();
  if(activeTab===3)return renderRelaciones();
  if(activeTab===4)return renderDiagnostico();
  if(activeTab===5)return renderConceptos();
  return renderValidaciones();
}

function getFilteredArchivos(){
  const q=search.trim().toLowerCase();
  return archivos.filter(a=>{
    const ms=!q||[a.nom,a.pre,a.desc,a.key,a.tipo].some(x=>String(x).toLowerCase().includes(q));
    const mt=filterTipo==="todos"||a.tipo===filterTipo;
    return ms&&mt;
  });
}

function renderArchivoGrid(filtered){
  if(!filtered.length){
    return `<div class="card" style="grid-column:1/-1;text-align:center;color:#94a3b8">
      No encontré archivos con ese criterio. Puedes borrar la búsqueda con la X.
    </div>`;
  }

  return filtered.map(a=>`
    <article class="file-card ${expandedCard===a.n?"open":""}" onclick="toggleCard(${a.n})" style="border-color:${expandedCard===a.n?tipoColor[a.tipo]:"#334155"}">
      <div class="file-head">
        ${badge(a.pre,tipoColor[a.tipo])}
        <div style="flex:1">
          <div class="file-title">${a.n}. ${esc(a.nom)}</div>
          <div class="file-meta">${esc(a.pre.toLowerCase())}aaaamm.ext</div>
          <div class="file-desc">${esc(a.desc)}<br><span class="chip" style="background:${tipoColor[a.tipo]}33;color:${tipoColor[a.tipo]}">${esc(a.tipo)}</span></div>
          <div class="file-key"><b>🔑 Llave única:</b><br>${esc(a.key)}</div>
        </div>
      </div>
    </article>`).join("");
}

function updateClearSearchButton(){
  const clear=document.getElementById("clearSearch");
  if(clear) clear.classList.toggle("show", search.trim().length>0);
}

function updateOverviewResults(){
  const filtered=getFilteredArchivos();
  const grid=document.getElementById("archivoGrid");
  const count=document.getElementById("archivoCount");

  if(grid) grid.innerHTML=renderArchivoGrid(filtered);
  if(count) count.textContent=`${filtered.length} archivos`;

  updateClearSearchButton();
}

function clearArchivoSearch(){
  search="";
  expandedCard=null;

  const input=document.getElementById("search");
  if(input){
    input.value="";
    input.focus();
  }

  updateOverviewResults();
}

function toggleCard(n){
  expandedCard=expandedCard===n?null:n;
  updateOverviewResults();
}

    <section class="notice">💡 Cuando algo falla, <b style="color:#a5b4fc">PERS es siempre el primer archivo a revisar</b>. Casi todos los errores de consistencia se detectan cruzando contra PERS.</section>
    ${relaciones.map(r=>`
      <section class="relation ${r.critico?"critical":""}">
        <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap">
          ${badge(r.desde,"#60a5fa")} <span style="color:#64748b;font-size:18px">→</span> ${badge(r.hacia,"#a5b4fc")}
          ${r.critico?`<span class="badge" style="background:#ef444422;color:#f87171">CRÍTICO</span>`:""}
        </div>
        <div style="margin-top:8px;color:#94a3b8;font-size:13px;line-height:1.5">${esc(r.regla)}</div>
      </section>`).join("")}
    <section class="card" style="margin-top:20px">
      <h3>🗺️ Ciclo de vida de un afiliado</h3>
      <div class="flow">
        ${fases.map(f=>`<div class="phase" style="border-color:${f.color}44">
          <div style="color:${f.color};font-weight:800;margin-bottom:6px">${esc(f.fase)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px">${f.archivos.map(a=>badge(a,f.color)).join("")}</div>
          <div style="font-size:11.5px;color:#94a3b8">${esc(f.desc)}</div>
        </div>`).join("")}
      </div>
    </section>`;
}

          <div>

/* ── 5. CONCEPTOS MEJORADO ── */
function ensureConceptStyles(){
  if(document.getElementById("concept-extra-styles")) return;

  const style=document.createElement("style");
  style.id="concept-extra-styles";
  style.textContent=`
    .concept-nav{
      position:sticky;
      top:116px;
      z-index:6;
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      background:rgba(15,23,42,.94);
      border:1px solid var(--line);
      border-radius:16px;
      padding:10px;
      margin-bottom:18px;
      box-shadow:0 14px 32px rgba(0,0,0,.25);
      backdrop-filter:blur(10px);
    }

    .concept-nav-title{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      color:#cbd5e1;
      font-size:12px;
      font-weight:800;
      margin-bottom:2px;
    }

    .concept-nav-hint{
      color:var(--dim);
      font-size:11px;
      font-weight:600;
    }

    .cnav-btn{
      position:relative;
      overflow:hidden;
    }

    .cnav-btn.active{
      background:#1e293b !important;
      box-shadow:0 0 0 2px rgba(96,165,250,.22);
      transform:translateY(-1px);
    }

    .concept-card{
      transition:border-color .22s ease, box-shadow .22s ease, transform .22s ease;
      scroll-margin-top:260px;
    }

    .concept-card.concept-highlight{
      border-color:#fbbf24 !important;
      box-shadow:0 0 0 3px rgba(251,191,36,.18),0 18px 42px rgba(0,0,0,.30);
      transform:translateY(-2px);
    }

    .concept-actions{
      display:flex;
      justify-content:flex-end;
      margin-top:12px;
    }

    .concept-top-btn{
      border:1px solid var(--line);
      background:#0f172a;
      color:#93c5fd;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      transition:.15s;
    }

    .concept-top-btn:hover{
      border-color:#60a5fa;
      color:#dbeafe;
      transform:translateY(-1px);
    }

    @media(max-width:680px){
      .concept-nav{
        position:static;
      }

      .concept-nav-title{
        display:block;
      }

      .concept-nav-hint{
        display:block;
        margin-top:4px;
      }

      .concept-card{
        scroll-margin-top:20px;
      }
    }
  `;
  document.head.appendChild(style);
}

function goConcepto(id){
  const el=document.getElementById(id);
  if(!el) return;

  document.querySelectorAll(".cnav-btn").forEach(btn=>btn.classList.remove("active"));
  const btn=document.querySelector(`[data-target="${id}"]`);
  if(btn) btn.classList.add("active");

  const header=document.querySelector("header");
  const nav=document.getElementById("concept-nav");
  const headerHeight=header && window.getComputedStyle(header).position==="sticky" ? header.offsetHeight : 0;
  const navHeight=nav && window.innerWidth>680 ? nav.offsetHeight : 0;
  const extraSpace=24;
  const offset=headerHeight+navHeight+extraSpace;
  const y=el.getBoundingClientRect().top+window.scrollY-offset;

  window.scrollTo({
    top:Math.max(y,0),
    behavior:"smooth"
  });

  el.classList.add("concept-highlight");

  if(history.replaceState){
    history.replaceState(null,"",`#${id}`);
  }

  setTimeout(()=>el.classList.remove("concept-highlight"),1400);
}

function goTopConceptos(){
  const nav=document.getElementById("concept-nav");
  if(!nav) return;

  const header=document.querySelector("header");
  const headerHeight=header && window.getComputedStyle(header).position==="sticky" ? header.offsetHeight : 0;
  const y=nav.getBoundingClientRect().top+window.scrollY-headerHeight-14;

  window.scrollTo({
    top:Math.max(y,0),
    behavior:"smooth"
  });
}

function renderConceptos(){
  ensureConceptStyles();

  app.innerHTML=`
    <section class="notice">
      🎓 Conceptos que no son obvios pero aparecen constantemente en validaciones y errores.
      Usa el menú como índice: al pinchar un concepto, baja directo a su explicación y la tarjeta queda resaltada.
    </section>

    <div class="concept-nav" id="concept-nav">
      <div class="concept-nav-title">
        <span>📌 Índice de conceptos</span>
        <span class="concept-nav-hint">Pincha un concepto para ir directo</span>
      </div>

      ${conceptos.map(c=>`
        <button
          class="cnav-btn"
          data-target="c-${c.id}"
          onclick="goConcepto('c-${c.id}')"
          style="border-color:${c.color}55;color:${c.color}"
          title="Ir a ${esc(c.titulo)}"
        >
          ${c.emoji} ${esc(c.titulo.split("–")[0].trim())}
        </button>
      `).join("")}
    </div>

    ${conceptos.map(c=>`
      <section class="concept-card" id="c-${c.id}" style="border-left:4px solid ${c.color}">
        <div class="chead">
          <span style="background:${c.color}22;color:${c.color};padding:4px 10px;border-radius:7px;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase">
            Concepto clave
          </span>
          <div class="ctitle">${c.emoji} ${esc(c.titulo)}</div>
        </div>

        <p class="cdesc">${esc(c.desc)}</p>

        <div class="cdetails">
          ${c.detalles.map(d=>`
            <div class="cd">
              <b>${esc(d[0])}:</b>
              <span style="color:#cbd5e1">${esc(d[1])}</span>
            </div>
          `).join("")}
        </div>

        <div class="concept-actions">
        </div>
      </section>
    `).join("")}
  `;

  const target=location.hash?.replace("#","");
  if(target && target.startsWith("c-")){
    setTimeout(()=>goConcepto(target),120);
  }
}

/* ── 6. VALIDACIONES ── */
function renderValidaciones(){
  const archsKeys=Object.keys(valPorArchivo);
  app.innerHTML=`
    <section class="notice">✅ Validaciones reales extraídas de la planilla oficial <b>validacionesBDAAFP.xlsx</b>. <b style="color:#fbbf24">I</b> = intra archivo · <b style="color:#60a5fa">E</b> = entre archivos · <b style="color:#a855f7">EA</b> = entre AFPs.</section>

    <section class="card">
      <h3>📋 Las 3 etapas de validación de la SP</h3>
      <div class="tw"><table>
        <thead><tr><th>Etapa</th><th>Qué valida</th><th>Archivo de error generado</th><th>Consecuencia</th></tr></thead>
        <tbody>
          ${valProceso.map(e=>`<tr>
            <td><b>${esc(e.etapa)}</b></td>
            <td style="color:#94a3b8;font-size:12px">${esc(e.valida)}</td>
            <td class="mono" style="font-size:11px">${esc(e.archivo)}</td>
            <td style="color:${e.critico?"#f87171":"#4ade80"};font-size:12px;font-weight:700">${esc(e.consecuencia)}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>
    </section>

    <section class="card">
      <h3>🔍 Validaciones por archivo</h3>
      <p style="font-size:12.5px;color:#94a3b8;margin:0 0 11px">Selecciona un archivo para ver sus validaciones críticas.</p>
      <div class="vtabs">
        ${archsKeys.map(a=>`<button class="vtab ${activeValArch===a?"active":""}" onclick="setValArch('${a}')">${a.toUpperCase()}</button>`).join("")}
      </div>
      <div class="tw"><table>
        <thead><tr><th style="width:85px">Código</th><th style="width:165px">Campo</th><th>Descripción de la validación</th><th style="width:55px">Tipo</th></tr></thead>
        <tbody>
          ${valPorArchivo[activeValArch].map(v=>{
            const tc={I:"#fbbf24",E:"#60a5fa",EA:"#a855f7"};
            return `<tr>
              <td class="cod">${esc(v[0])}</td>
              <td><b>${esc(v[1])}</b></td>
              <td style="color:#cbd5e1">${esc(v[2])}</td>
              <td><span class="badge" style="background:${tc[v[3]]}22;color:${tc[v[3]]}">${esc(v[3])}</span></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
    </section>`;
}
function setValArch(a){activeValArch=a;renderValidaciones();}


function goPageTop(){
  window.scrollTo({top:0,behavior:"smooth"});
}

function updateBackTopButton(){
  const btn=document.getElementById("backTopBtn");
  if(!btn) return;
  btn.classList.toggle("show", window.scrollY>280);
}

window.addEventListener("scroll", updateBackTopButton, {passive:true});
window.addEventListener("load", updateBackTopButton);

render();
</script>
